name: Daily Morning Check

on:
  schedule:
    # Minden nap 5:30 UTC = 7:30 közép-európai (nyári: 6:30 UTC)
    # Reggeli kávézás közben friss az index.html banner-je.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      notes:
        description: "Friss megjegyzés (alvás, fájdalom, stressz, érzések...)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          ATHLETE_NOTES: ${{ github.event.inputs.notes }}
        run: python scripts/run_daily_check.py

      - name: Commit & push daily status
        run: |
          git config user.name "im703-coach-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/daily_status.json output/daily_*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nincs változás."
          else
            git commit -m "📅 Napi check: $(date -u +%Y-%m-%d)"
            git push
          fi
